    <div class="app" id="app">
      <!-- ── Title bar ─────────────────────────────────────────────── -->
      <header class="titlebar">
        <div class="titlebar__left">
          <span class="brand">
            <svg class="brand__mark"><use href="#i-logo" /></svg>
            <span class="brand__name">Codes</span>
            <span class="brand__version">0.2</span>
          </span>
          <nav class="menubar" id="menubar" aria-label="Main menu">
            <button type="button" class="menubar__item" data-menu="project">Project</button>
            <button type="button" class="menubar__item" data-menu="file">File</button>
            <button type="button" class="menubar__item" data-menu="edit">Edit</button>
            <button type="button" class="menubar__item" data-menu="run">Run</button>
            <button type="button" class="menubar__item" data-menu="view">View</button>
            <button type="button" class="menubar__item" data-menu="help">Help</button>
          </nav>
        </div>

        <div class="titlebar__right">
          <span class="titlebar__os" id="os-badge">Windows</span>
          <div class="wincontrols">
            <button type="button" class="wincontrols__btn" data-window="minimize" title="Minimize" aria-label="Minimize">
              <svg><use href="#i-minimize" /></svg>
            </button>
            <button type="button" class="wincontrols__btn" data-window="maximize" title="Maximize" aria-label="Maximize">
              <svg><use href="#i-maximize" /></svg>
            </button>
            <button type="button" class="wincontrols__btn wincontrols__btn--close" data-window="close" title="Close" aria-label="Close">
              <svg><use href="#i-close" /></svg>
            </button>
          </div>
        </div>
      </header>

      <!-- ── Workbench ──────────────────────────────────────────────── -->
      <div class="workbench">
        <aside class="sidebar" id="sidebar">
          <div class="sidebar__header">
            <span class="sidebar__title">Explorer</span>
            <span class="sidebar__project" id="sidebar-project"></span>
          </div>
          <div class="sidebar__toolbar">
            <button type="button" class="iconbtn" id="btn-new-file" title="New file" aria-label="New file">
              <svg><use href="#i-new-file" /></svg>
            </button>
            <button type="button" class="iconbtn" id="btn-new-folder" title="New folder" aria-label="New folder">
              <svg><use href="#i-new-folder" /></svg>
            </button>
            <button type="button" class="iconbtn" id="btn-refresh" title="Refresh explorer" aria-label="Refresh explorer">
              <svg><use href="#i-refresh" /></svg>
            </button>
            <button type="button" class="iconbtn" id="btn-collapse" title="Collapse all" aria-label="Collapse all">
              <svg><use href="#i-collapse" /></svg>
            </button>
          </div>
          <div class="explorer" id="explorer" role="tree" aria-label="Project files"></div>
        </aside>

        <div class="splitter splitter--vertical" id="split-sidebar" role="separator" aria-orientation="vertical"></div>

        <main class="main" id="main">
          <div class="tabs" id="tabs">
            <div class="tabs__list" id="tabs-list" role="tablist"></div>
            <div class="tabs__actions">
              <button type="button" class="iconbtn" id="btn-run" title="Run JavaScript file (F5)" aria-label="Run">
                <svg><use href="#i-play" /></svg>
              </button>
              <button type="button" class="iconbtn" id="btn-save" title="Save (Ctrl+S)" aria-label="Save">
                <svg><use href="#i-save" /></svg>
              </button>
              <button type="button" class="iconbtn" id="btn-preview" title="Preview HTML file" aria-label="Preview">
                <svg><use href="#i-preview" /></svg>
              </button>
            </div>
          </div>

          <div class="editor-area" id="editor-area">
            <div class="editor-host" id="editor-host"></div>

            <div class="welcome" id="welcome">
              <div class="welcome__inner">
                <div class="welcome__logo">
                  <svg class="welcome__mark"><use href="#i-logo" /></svg>
                </div>
                <h1 class="welcome__title">Codes</h1>
                <p class="welcome__subtitle">Lightweight Development Environment</p>

                <div class="welcome__actions">
                  <button type="button" class="button button--primary" id="btn-open-project">
                    <svg><use href="#i-folder-open-project" /></svg>
                    <span>Open Project</span>
                  </button>
                </div>

                <section class="welcome__section" id="welcome-recent-section">
                  <h2 class="welcome__section-title">Recent Projects</h2>
                  <ul class="welcome__list" id="welcome-recent"></ul>
                </section>

                <section class="welcome__section">
                  <h2 class="welcome__section-title">Quick Start</h2>
                  <div class="welcome__cards">
                    <button type="button" class="quickcard" data-template="javascript">
                      <svg class="quickcard__icon"><use href="#i-braces" /></svg>
                      <span class="quickcard__title">JavaScript</span>
                      <span class="quickcard__hint">Run with Node.js &mdash; F5</span>
                    </button>
                    <button type="button" class="quickcard" data-template="html">
                      <svg class="quickcard__icon"><use href="#i-html" /></svg>
                      <span class="quickcard__title">HTML</span>
                      <span class="quickcard__hint">Preview in a live window</span>
                    </button>
                    <button type="button" class="quickcard" data-template="css">
                      <svg class="quickcard__icon"><use href="#i-css" /></svg>
                      <span class="quickcard__title">CSS</span>
                      <span class="quickcard__hint">Autocomplete &amp; highlighting</span>
                    </button>
                  </div>
                </section>
              </div>
            </div>
          </div>

          <div class="splitter splitter--horizontal" id="split-terminal" role="separator" aria-orientation="horizontal"></div>

          <section class="panel" id="terminal-panel">
            <header class="panel__header">
              <div class="panel__tabs" id="terminal-tabs" role="tablist"></div>
              <div class="panel__title">Terminal</div>
              <div class="panel__actions">
                <button type="button" class="iconbtn" id="btn-terminal-clear" title="Clear terminal" aria-label="Clear terminal">
                  <svg><use href="#i-collapse" /></svg>
                </button>
                <button type="button" class="iconbtn" id="btn-terminal-stop" title="Stop running process" aria-label="Stop process">
                  <svg><use href="#i-stop" /></svg>
                </button>
                <button type="button" class="iconbtn" id="btn-terminal-close" title="Hide terminal" aria-label="Hide terminal">
                  <svg><use href="#i-close" /></svg>
                </button>
              </div>
            </header>
            <div class="terminal-host" id="terminal-host"></div>
          </section>
        </main>
      </div>

      <!-- ── Status bar ─────────────────────────────────────────────── -->
      <footer class="statusbar">
        <div class="statusbar__group">
          <span class="status status--ready" id="status-message">Ready</span>
          <span class="statusbar__sep"></span>
          <span class="status" id="status-language">Plain Text</span>
          <span class="statusbar__sep"></span>
          <span class="status">UTF-8</span>
          <span class="statusbar__sep"></span>
          <span class="status" id="status-eol">LF</span>
        </div>
        <div class="statusbar__group statusbar__group--right">
          <span class="status" id="status-position">Ln 1, Col 1</span>
          <span class="statusbar__sep"></span>
          <span class="status" id="status-selection"></span>
          <span class="statusbar__sep"></span>
          <span class="status" id="status-project">No Project</span>
          <span class="statusbar__sep"></span>
          <span class="status" id="status-shell">CMD</span>
        </div>
      </footer>
    </div>

    <!-- ── Overlays ─────────────────────────────────────────────────── -->
    <div class="palette" id="palette" hidden>
      <div class="palette__box" role="dialog" aria-modal="true" aria-label="Command palette">
        <div class="palette__input-wrap">
          <svg class="palette__icon"><use href="#i-search" /></svg>
          <input class="palette__input" id="palette-input" type="text" placeholder="Type a command…" autocomplete="off" spellcheck="false" />
        </div>
        <ul class="palette__list" id="palette-list" role="listbox"></ul>
        <div class="palette__hint">
          <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
          <span><kbd>Enter</kbd> run</span>
          <span><kbd>Esc</kbd> close</span>
        </div>
      </div>
    </div>

    <div class="contextmenu" id="context-menu" hidden role="menu"></div>

    <div class="modal" id="modal" hidden>
      <div class="modal__backdrop" id="modal-backdrop"></div>
      <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 class="modal__title" id="modal-title">Confirm</h2>
        <p class="modal__message" id="modal-message"></p>
        <input class="modal__input" id="modal-input" type="text" autocomplete="off" spellcheck="false" />
        <div class="modal__actions">
          <button type="button" class="button" id="modal-cancel">Cancel</button>
          <button type="button" class="button button--primary" id="modal-confirm">Confirm</button>
        </div>
      </div>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script type="module" src="./renderer.js"></script>
  </body>
</html>
